name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, MySQL und Migrationen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: fittrack_test_ci
      DB_PORT: 3306
      JWT_SECRET: fittrack-ci-secret-with-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
      ALLOW_TEST_DB_RESET: "true"
      FITTRACK_RUN_DB_INTEGRATION: "true"
      FITTRACK_AUTO_MIGRATE: "false"
      FITTRACK_MIGRATION_EXPECTED_DATABASE: fittrack_test_ci

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # GitHub-Actions-Service-Container laufen unter einem intern generierten
      # Namen, nie unter "fittrack_mysql" - nur der über den Job-Kontext
      # ausgelieferte Container-ID-Wert (job.services.mysql.id) referenziert
      # zuverlässig genau den für diesen Job gestarteten MySQL-Dienst. Dieser
      # Schritt validiert diesen Kandidaten fail-closed (muss existieren, muss
      # laufen, muss exakt ein Treffer sein, muss das konfigurierte
      # mysql:8.0-Image sein) und schreibt ihn genau einmal nach GITHUB_ENV,
      # damit alle nachfolgenden Schritte in diesem Job denselben, geprüften
      # Container über FITTRACK_DB_CONTAINER verwenden - ohne den Namen
      # irgendwo erneut zu erraten oder hart zu codieren.
      - name: MySQL-Service-Container auflösen und validieren
        run: |
          set -euo pipefail
          CANDIDATE="${{ job.services.mysql.id }}"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::job.services.mysql.id ist leer - der MySQL-Service-Container konnte nicht ermittelt werden."
            exit 1
          fi
          MATCH_COUNT=$(docker ps -q --filter "id=$CANDIDATE" --filter "status=running" | wc -l | tr -d ' ')
          if [ "$MATCH_COUNT" != "1" ]; then
            echo "::error::Erwartet genau einen laufenden Container für ID $CANDIDATE, gefunden: $MATCH_COUNT"
            exit 1
          fi
          IMAGE=$(docker inspect --format '{{.Config.Image}}' "$CANDIDATE")
          if [ "$IMAGE" != "mysql:8.0" ]; then
            echo "::error::Aufgelöster Container $CANDIDATE nutzt Image '$IMAGE', erwartet 'mysql:8.0' (siehe services.mysql in diesem Workflow)."
            exit 1
          fi
          echo "FITTRACK_DB_CONTAINER=$CANDIDATE" >> "$GITHUB_ENV"
          echo "MySQL-Service-Container aufgelöst und validiert (ID: $CANDIDATE, Image: $IMAGE)."

      - name: "Preflight: Docker und MySQL-Client im aufgelösten Container prüfen"
        run: |
          set -euo pipefail
          echo "Docker-Version:"
          docker --version
          echo "Aufgelöster Container: $FITTRACK_DB_CONTAINER"
          docker inspect --format 'Status: {{.State.Status}} | Image: {{.Config.Image}}' "$FITTRACK_DB_CONTAINER"
          docker exec "$FITTRACK_DB_CONTAINER" mysqldump --version

      # Stage 2B2A off-host storage integration tests need a real S3-compatible
      # endpoint. GitHub Actions' `services:` block cannot override a
      # container's command, and the minio/minio image requires an explicit
      # `server /data` argument to start - so this runs it as a job-local
      # `docker run` step instead (this job controls the container's name
      # directly, unlike the MySQL service, so no dynamic-container-ID
      # resolution is needed here). Credentials are synthetic and
      # test-only, matching the defaults in
      # backend/test/integration/backupRemoteMinio.test.js; bound to
      # loopback only. Nothing here creates or configures a bucket - that
      # stays the test suite's own job (see
      # backend/test/helpers/minioTestBucket.js), consistent with
      # production code never creating buckets either.
      - name: MinIO für Stage-2B2A-Remote-Backup-Tests starten
        run: |
          set -euo pipefail
          docker run -d --name fittrack_ci_minio \
            -p 127.0.0.1:9000:9000 -p 127.0.0.1:9001:9001 \
            -e MINIO_ROOT_USER=fittrack-test-minio-user \
            -e MINIO_ROOT_PASSWORD=fittrack-test-minio-password \
            minio/minio server /data --console-address ":9001"
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1; then
              echo "MinIO ist bereit."
              exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO wurde nicht innerhalb von 30 Sekunden bereit."
          docker logs fittrack_ci_minio || true
          exit 1

      - name: Node.js 22.17.0 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Toolchain ausgeben
        run: |
          node --version
          npm --version

      - name: Backend reproduzierbar installieren
        working-directory: backend
        run: npm ci

      - name: Backend-Syntax prüfen
        working-directory: backend
        run: npm run test:syntax

      - name: Security-Audit ab high
        working-directory: backend
        run: npm run audit:security

      - name: Geschützten Test-Reset und Migration-No-op prüfen
        working-directory: backend
        run: |
          npm run db:test:reset
          npm run db:migrate
          npm run db:migrate:status

      - name: Migration Doctor auf sauberer Testdatenbank
        working-directory: backend
        run: npm run db:migrate:doctor

      - name: Legacy-Wegwerf-Backup (unverschlüsselt), Hash und Status prüfen
        working-directory: backend
        env:
          # Nur für diesen einzelnen Legacy-Regressionsschritt: der alte,
          # unverschlüsselte db:backup:daily-Pfad ist seit der Stage-2B1-
          # Release-Gate-Härtung standardmäßig gesperrt. Dieser Schalter gilt
          # ausschließlich innerhalb dieses Steps (kein Job-/Workflow-Env) und
          # wirkt in NODE_ENV=production ohnehin nie - siehe
          # assertLegacyUnencryptedBackupAllowed in backend/scripts/databaseSafety.js.
          # Für den produktiven, verschlüsselten Pfad siehe
          # docs/STAGE_2B1_ENCRYPTED_BACKUP_RESTORE.md.
          # FITTRACK_DB_CONTAINER kommt bereits validiert aus GITHUB_ENV (siehe
          # Schritt "MySQL-Service-Container auflösen und validieren" oben).
          ALLOW_LEGACY_UNENCRYPTED_BACKUP: "true"
          FITTRACK_BACKUP_DIR: ${{ runner.temp }}/fittrack-ci-backups
          FITTRACK_BACKUP_EXPECTED_DATABASE: fittrack_test_ci
          FITTRACK_BACKUP_ACK: backup:fittrack_test_ci
        run: |
          npm run db:backup:daily
          npm run db:backup:status

      - name: Backend-Suite mit Zwei-Nutzer-Isolation und Wegwerf-DBs
        working-directory: backend
        run: npm test

      - name: Unit-Coverage erzeugen
        working-directory: backend
        run: npm run test:coverage

      - name: MinIO-Testcontainer stoppen
        if: always()
        run: docker rm -f fittrack_ci_minio || true

  frontend:
    name: Frontend-Tests und Produktionsbuild
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22.17.0 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Toolchain ausgeben
        run: |
          node --version
          npm --version

      - name: Frontend reproduzierbar installieren
        working-directory: frontend
        run: npm ci

      - name: Security-Audit ab high
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend-Tests ausführen
        working-directory: frontend
        run: npm run test:run

      - name: Produktionsbuild erstellen
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  browser:
    name: Chromium-E2E und Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22.17.0 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend reproduzierbar installieren
        working-directory: backend
        run: npm ci

      - name: Frontend reproduzierbar installieren
        working-directory: frontend
        run: npm ci

      - name: Playwright Chromium installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Isolierte Chromium-E2E-/Axe-Matrix ausführen
        working-directory: frontend
        run: npm run test:e2e

      - name: Fehlerartefakte sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
